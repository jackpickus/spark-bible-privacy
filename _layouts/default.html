<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --bg:      #F5F0E8;
      --surface: #FDFAF4;
      --gold:    #C9973B;
      --olive:   #7A8C5E;
      --text:    #2C2A25;
      --muted:   #6B6558;
      --border:  #E0D8C8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .app-icon {
      width: 72px;
      height: 72px;
      background: var(--gold);
      border-radius: 18px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: normal;
      letter-spacing: 0.01em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }

    /* Markdown-rendered body */
    .content h2 {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 2.25rem 0 0.75rem;
    }

    .content p {
      margin-bottom: 1rem;
    }

    .content ul {
      padding-left: 1.4rem;
      margin-bottom: 1rem;
    }

    .content li { margin-bottom: 0.4rem; }

    .content a { color: var(--gold); }

    .content strong { font-weight: bold; }

    /* Data table */
    .content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin: 1rem 0 1.5rem;
    }

    .content table th {
      text-align: left;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 2px solid var(--border);
      padding: 0.5rem 0.75rem;
    }

    .content table td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .content table tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 100px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-local  { background: #EAF2E4; color: #3D6B2A; }
    .badge-remote { background: #FFF0D4; color: #8A5A00; }

    footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="app-icon">✝</div>
      <h1>Privacy Policy</h1>
      <p class="subtitle">Spark Bible &mdash; Effective May 23, 2026</p>
    </header>

    <div class="content">
      {{ content }}
    </div>

    <footer>
      &copy; 2026 Spark Bible. All rights reserved.
    </footer>
  </div>
</body>
</html>
