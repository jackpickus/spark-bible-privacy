<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --bg:     #F5F0E8;
      --gold:   #C9973B;
      --olive:  #7A8C5E;
      --text:   #2C2A25;
      --muted:  #6B6558;
      --border: #D9CEB8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 1rem;
    }

    /* ── Top bar ── */
    .topbar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 2rem;
    }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .topbar-inner a {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }

    /* ── Main content ── */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 3.5rem 2rem 5rem;
    }

    /* ── Page header ── */
    .page-header {
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .page-header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
    }

    .effective-date {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ── Markdown content ── */
    .content h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0 0 0.9rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
    }

    .content h2:first-child {
      padding-top: 0;
      border-top: none;
    }

    .content h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin: 1.75rem 0 0.5rem;
    }

    .content p {
      margin-bottom: 1rem;
    }

    /* space between consecutive sections */
    .content h2 + p,
    .content h2 + table { margin-top: 0; }

    .content ul, .content ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .content li { margin-bottom: 0.35rem; }

    .content a {
      color: var(--gold);
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--gold) 40%, transparent);
      text-underline-offset: 3px;
    }

    .content a:hover {
      text-decoration-color: var(--gold);
    }

    .content strong { font-weight: 600; }

    /* ── Section spacing ── */
    .content > * + h2 { margin-top: 2.5rem; }

    /* ── Data table ── */
    .content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin: 1.25rem 0 1.75rem;
    }

    .content table th {
      text-align: left;
      font-size: 0.73rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0.75rem 0.5rem 0;
    }

    .content table th:last-child,
    .content table td:last-child { padding-right: 0; }

    .content table td {
      padding: 0.65rem 0.75rem 0.65rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      vertical-align: top;
    }

    .content table tr:last-child td { border-bottom: none; }

    /* Storage badges */
    .badge {
      display: inline-block;
      font-size: 0.71rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge-local  { background: #edf2e7; border-color: #c5d9b8; color: #3a5e2a; }
    .badge-remote { background: #fdf3e3; border-color: #e8ceA0; color: #7a4d00; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.75rem 2rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .container { padding: 2rem 1.25rem 4rem; }
      .page-header h1 { font-size: 1.6rem; }
      .content table { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a href="#">Spark Bible</a>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h1>Privacy Policy</h1>
      <p class="effective-date">Effective May 23, 2026</p>
    </div>

    <div class="content">
      {{ content }}
    </div>
  </div>

  <footer>
    &copy; 2026 Spark Bible. All rights reserved.
  </footer>
</body>
</html>
